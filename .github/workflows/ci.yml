name: Scholarship Scout CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scholarship-scout-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Generate exact test dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scholarship-scout-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Emit generated lockfile for exact repository commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const encoded = readFileSync("package-lock.json").toString("base64");
          for (let offset = 0, index = 0; offset < encoded.length; offset += 3000, index += 1) {
            console.log(`LOCKFILE_CHUNK_${String(index).padStart(3, "0")}=${encoded.slice(offset, offset + 3000)}`);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Stage 1 - deprecated API and retired-code scan
        run: npm run check:deprecated

      - name: Stage 2 - dependency security audit
        run: npm audit --audit-level=moderate

      - name: Stage 3 - TypeScript validation and production build
        run: npm run build

      - name: Focused discovery profile privacy regression
        run: node --import ./scripts/register-tsx-coverage-loader.mjs --enable-source-maps --test tests/discoveryLocalProfileFlow.test.mjs

      - name: Stage 4 - complete unit and integration test suite
        run: npm test

      - name: Stage 5 - source-mapped TypeScript and TSX coverage
        run: npm run test:coverage

      - name: Upload machine-readable coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scholarship-scout-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
